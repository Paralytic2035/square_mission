## square_mission 参数 —— 仿真默认值
## 实机请改：if_debug: 0，航点改成 5 个、边长 1.0

altitude : 0.8      # 相对起飞点的飞行高度 [m]
err_max  : 0.15     # 到点判定误差 [m]
if_debug : 1        # 1=程序自动切 OFFBOARD；0=飞手拨杆
stop_time: 0.0      # 每点到点后额外悬停秒数

waypoints:
  "0": {x: 0.0, y: 0.0}
  "1": {x: 0.5, y: 0.0}
  "2": {x: 0.5, y: 0.5}
  "3": {x: 0.0, y: 0.5}
